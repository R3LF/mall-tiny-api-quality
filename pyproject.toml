[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# 应用型仓库（无可分发的 Python 包）：显式声明空包列表，
# 避免 setuptools 平面布局自动发现在多个顶层目录时报错
[tool.setuptools]
packages = []

[project]
name = "mall-tiny-api-quality"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "allure-pytest>=2.16,<3",
    "jsonschema>=4.26,<5",
    "locust>=2.46,<3",
    "pymysql>=1.1,<2",
    "pytest>=9,<10",
    "pytest-html>=4,<5",
    "pyyaml>=6,<7",
    "redis>=7,<9",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "smoke: critical-path API checks",
    "integration: tests requiring mall-tiny or its infrastructure",
    "cache: Redis cache consistency tests",
]

