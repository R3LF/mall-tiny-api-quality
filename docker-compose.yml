# ============================================================
# mall-tiny 接口测试环境：一条命令重建被测系统三件套
#
#   前置：
#     1. 被测源码 mall-tiny（固定 commit a81ec47）需已构建好 jar：
#        mvn -f mall-tiny/pom.xml -DskipTests package
#        源码目录通过环境变量 MALL_TINY_SOURCE 指定（默认 ./mall-tiny）
#     2. Windows 本机需先停掉占用 3306/6379 的本地 MySQL/Redis 服务
#        （CI 的 Linux runner 无此问题）
#
#   启动：  docker compose up -d --build
#   清理：  docker compose down -v   （注意：-v 会删除数据卷）
# ============================================================
services:
  db:
    image: mysql:5.7
    container_name: mall-tiny-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: mall_tiny
      TZ: Asia/Shanghai
    volumes:
      # 01_schema.sql = 固定 commit 的 mall_tiny.sql 冻结副本 + USE 头（保证可复现）
      # 02_test_password.sql = 将 admin 密码重置为测试账号 Qa123456
      - ./docker/mysql-init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docker/mysql-init/02_test_password.sql:/docker-entrypoint-initdb.d/02_test_password.sql:ro
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:6.2
    container_name: mall-tiny-test-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    # 镜像由 docker/app.Dockerfile 构建（上下文为 mall-tiny 源码目录）：
    #   docker build -f docker/app.Dockerfile -t mall-tiny:test ${MALL_TINY_SOURCE}
    # CI 的工作流会先 mvn package 再执行这条构建命令
    image: mall-tiny:test
    pull_policy: never
    container_name: mall-tiny-test-app
    environment:
      - spring.profiles.active=prod
      - spring.datasource.url=jdbc:mysql://db:3306/mall_tiny?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.username=root
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD:-root}
      - spring.redis.host=redis
      # 容器默认 POSIX locale 会让校验消息退化为英文（"must not be empty"），
      # 与本机中文环境不一致——显式指定 JVM locale 保持行为一致
      - JAVA_TOOL_OPTIONS=-Duser.language=zh -Duser.country=CN
      - TZ=Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql-data:
